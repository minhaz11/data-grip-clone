[workspace]
resolver = "3"
members = ["crates/store", "crates/secrets", "crates/connections", "crates/db-core", "crates/db-postgres", "apps/desktop/src-tauri"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
quarry-store = { path = "crates/store" }
quarry-secrets = { path = "crates/secrets" }
quarry-connections = { path = "crates/connections" }
quarry-db-core = { path = "crates/db-core" }
quarry-db-postgres = { path = "crates/db-postgres" }
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
tempfile = "3.27.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"
