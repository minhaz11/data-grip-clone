[package]
name = "quarry-db-postgres"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "PostgreSQL adapter (tokio-postgres + rustls)."

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
futures-util = "0.3.34"
quarry-db-core.workspace = true
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
tokio = { version = "1.53.3", features = ["time", "rt", "net", "macros"] }
tokio-postgres = "0.7.18"
tokio-postgres-rustls = { version = "0.14.0", features = ["ring"] }

[dev-dependencies]
csv = "1.3.1"
memory-stats = "1.2.0"
quarry-io.workspace = true
serde_json.workspace = true
tempfile.workspace = true
quarry-secrets = { path = "../secrets" }
quarry-ssh.workspace = true
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "sync"] }

[lints]
workspace = true
