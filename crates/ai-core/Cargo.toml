[package]
name = "quarry-ai-core"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "AI provider contract (ADR-0005): streamed completions, models, kill switch."

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
serde.workspace = true
thiserror.workspace = true
ts-rs = { workspace = true, optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "async-await-macro", "std"] }
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["rt", "macros"] }

[lints]
workspace = true
