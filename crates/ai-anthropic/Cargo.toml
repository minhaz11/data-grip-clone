[package]
name = "quarry-ai-anthropic"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Anthropic Messages API provider (streaming over HTTPS from Rust)."

[dependencies]
futures-util = { version = "0.3.34", default-features = false, features = ["alloc"] }
quarry-ai-core.workspace = true
quarry-secrets.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider", "http2", "stream", "charset", "json", "query"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8.5"
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
quarry-logging.workspace = true
tempfile.workspace = true
futures-util = { version = "0.3.34", default-features = false, features = ["alloc", "std"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync"] }

[lints]
workspace = true
