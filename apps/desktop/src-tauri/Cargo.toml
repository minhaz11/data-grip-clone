[package]
name = "quarry-desktop"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true
description = "Quarry desktop shell (Tauri)."

[lib]
name = "quarry_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.3", features = [] }

[dependencies]
tauri = { version = "2.12.4", features = [] }
quarry-store.workspace = true
quarry-secrets.workspace = true
quarry-connections.workspace = true
quarry-db-core.workspace = true
quarry-db-postgres.workspace = true
quarry-ssh.workspace = true
quarry-workspace.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { version = "1.53.3", features = ["sync", "time"] }
uuid = { version = "1.28.0", features = ["v4"] }
tauri-plugin-dialog = "2.8.3"
tauri-plugin-clipboard-manager = "2.5.0"
quarry-io.workspace = true
quarry-logging.workspace = true
tracing.workspace = true

[dev-dependencies]
# Enables the TypeScript derives for the bindings test (src/bindings.rs).
ts-rs.workspace = true
quarry-db-core = { workspace = true, features = ["ts"] }
quarry-store = { workspace = true, features = ["ts"] }
quarry-connections = { workspace = true, features = ["ts"] }
tokio = { version = "1.53.3", features = ["rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
